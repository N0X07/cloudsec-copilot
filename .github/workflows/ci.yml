name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Validate labeled security dataset
        run: python scripts/validate_dataset.py

      - name: Validate infrastructure security invariants
        run: python scripts/validate_infrastructure.py

      - name: Validate demo PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD "scripts/demo.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      - name: Build production container
        run: docker build --tag cloudsec-copilot:ci .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
